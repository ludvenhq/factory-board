# Host nginx: /etc/nginx/sites-available/factory-board.ludven.com (Ludven since 2026-10-05).
# The container listens on 127.0.0.1:3002 (deploy/compose.yml). The old address,
# factory-board.gapchix.io, keeps its certificate and answers with a permanent redirect, so
# links already out there still land.
#
# Certificates, webroot (the port-80 block below serves the challenge):
#   certbot certonly --webroot -w /var/www/letsencrypt --cert-name factory-board.ludven.com \
#     -d factory-board.ludven.com -d www.factory-board.ludven.com
#   certbot certonly --webroot -w /var/www/letsencrypt --cert-name factory-board.gapchix.io \
#     -d factory-board.gapchix.io
# Then: ln -s into sites-enabled (in place of the old factory-board.gapchix.io file), nginx -t,
# reload.

server {
    listen 80;
    listen [::]:80;
    server_name factory-board.ludven.com www.factory-board.ludven.com factory-board.gapchix.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://factory-board.ludven.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name factory-board.ludven.com;

    ssl_certificate     /etc/letsencrypt/live/factory-board.ludven.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/factory-board.ludven.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.factory-board.ludven.com;

    ssl_certificate     /etc/letsencrypt/live/factory-board.ludven.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/factory-board.ludven.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://factory-board.ludven.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name factory-board.gapchix.io;

    ssl_certificate     /etc/letsencrypt/live/factory-board.gapchix.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/factory-board.gapchix.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://factory-board.ludven.com$request_uri;
}
